services:
  app:
    image: hutschen/mv-tool:latest
    volumes:
      - ./config.yml:/usr/src/api/config.yml
    ports:
      - '8000:8000'
    depends_on:
      - ldap
      - db
      - ldap-user-manager

  ldap:
    image: bitnami/openldap:2.5
    container_name: ldap
    environment:
      LDAP_ADMIN_USERNAME: 'admin'
      LDAP_ADMIN_PASSWORD: 'adminpasswd'
      LDAP_ROOT: 'dc=example,dc=org'
      LDAP_ADMIN_DN: 'cn=admin,dc=example,dc=org'
    # ports:
    #   - '1389:1389'
    volumes:
      - ldap_data:/bitnami/openldap

  db:
    image: postgres:15.6
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpasswd
      POSTGRES_DB: mvtool
    # ports:
    #   - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ldap-user-manager:
    image: wheelybird/ldap-user-manager:latest
    container_name: ldap-user-manager
    depends_on:
      - ldap
    environment:
      SERVER_HOSTNAME: localhost
      LDAP_URI: ldap://ldap:1389
      LDAP_BASE_DN: dc=example,dc=org
      LDAP_ADMIN_BIND_DN: cn=admin,dc=example,dc=org
      LDAP_ADMIN_BIND_PWD: adminpasswd
      LDAP_ADMINS_GROUP: admins
      LDAP_REQUIRE_STARTTLS: "FALSE"
      NO_HTTPS: "TRUE"
      LDAP_IGNORE_CERT_ERRORS: "TRUE"
    ports:
      - '8080:80'

volumes:
  ldap_data:
  postgres_data:
